[project]
name = "ue5-scene-kit"
version = "0.2.0"
description = "Fail-loud Unreal Engine editor-Python primitives for cinematic scene assembly"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sai Chandra" }]
keywords = ["unreal-engine", "ue5", "cinematics", "editor-scripting", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "build>=1"]

[project.scripts]
ue5-scene-kit = "ue5_scene_kit.__main__:main"

[project.urls]
Repository = "https://github.com/itsmeeChandU/ue5-scene-kit"
Issues = "https://github.com/itsmeeChandU/ue5-scene-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ue5_scene_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP045"]
